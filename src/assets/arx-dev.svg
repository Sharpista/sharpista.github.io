<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <!-- Background definition for contrast/preview -->
  <rect width="480" height="120" rx="16" fill="#0E0E10"/>
  
  <!-- Subtle Grid Accent / Precision matrix -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="2 3">
    <line x1="28" y1="20" x2="28" y2="100" />
    <line x1="108" y1="20" x2="108" y2="100" />
    <line x1="20" y1="60" x2="116" y2="60" />
  </g>

  <!-- Geometric Symbol: Architectural Monogram A + X with forward vector -->
  <g transform="translate(36, 26)">
    <!-- Base structural glow -->
    <defs>
      <linearGradient id="arx-line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="60%" stop-color="#EDEDED" />
        <stop offset="100%" stop-color="#8E8E93" />
      </linearGradient>
      <linearGradient id="arx-accent-core" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#71717A" />
      </linearGradient>
    </defs>

    <!-- Outer Angular Prism / Apex 'A' and intersecting 'X' crossbeams -->
    <!-- Left diagonal upward strut -->
    <path d="M6 58 L32 8 L42 8 L68 58 L54 58 L37 25 L20 58 Z" fill="url(#arx-line-grad)"/>

    <!-- Intersecting precision chevron / Core dynamic accelerator -->
    <path d="M18 42 L37 28 L56 42 L50 48 L37 38 L24 48 Z" fill="#FFFFFF"/>

    <!-- Distinctive engineering node / Apex coordinate dot -->
    <circle cx="37" cy="8" r="3" fill="#FFFFFF" />
    <circle cx="6" cy="58" r="2.5" fill="#71717A" />
    <circle cx="68" cy="58" r="2.5" fill="#71717A" />

    <!-- Terminal syntax cursor indicator -->
    <rect x="33" y="55" width="8" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography: Clean, high-precision typographic treatment -->
  <g transform="translate(132, 70)">
    <!-- Brand Wordmark: ARX -->
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#FFFFFF">
      ARX
    </text>

    <!-- Divider Pill / Technical Token -->
    <rect x="114" y="-22" width="1" height="24" fill="#2E2E33" />
    <rect x="117" y="-22" width="1" height="24" fill="#1C1B1D" />

    <!-- Sub-brand / Engine Tag: DEV -->
    <text x="130" y="0" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="28" font-weight="500" letter-spacing="2.5" fill="#A1A1AA">
      DEV
    </text>
  </g>

  <!-- Technical Subtitle / Architectural Descriptor -->
  <g transform="translate(134, 91)">
    <circle cx="4" cy="-4" r="2" fill="#22C55E" />
    <text x="12" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500" letter-spacing="1.8" fill="#71717A">
      HIGH-PERFORMANCE ARCHITECTURE
    </text>
  </g>

  <!-- Border Frame Accent (minimal technical enclosure) -->
  <rect x="0.5" y="0.5" width="479" height="119" rx="15.5" stroke="#26262B" stroke-width="1" />
</svg>